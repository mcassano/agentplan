[package]
name = "agentplan"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "terraform plan for AI agents: run any agent on a copy-on-write copy of your project, review one plan of file changes and network calls, then apply or discard it"
authors = ["Michael Cassano"]
license = "MIT"
repository = "https://github.com/mcassano/agentplan"
homepage = "https://github.com/mcassano/agentplan"
readme = "README.md"
keywords = ["ai", "agents", "sandbox", "diff", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/docs"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
dirs = "7.0.0"
globset = "0.4.21"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12", "logging"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "client-legacy"] }
libc = "0.2.191"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "serde", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.2.1"
walkdir = "2.5.0"
webpki-roots = "1.0.12"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
